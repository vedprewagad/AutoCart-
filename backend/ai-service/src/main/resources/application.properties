spring.application.name=ai-service

server.port=${PORT:8084}

# Eureka Client Configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# Business Service URL for catalog search integration
business.service.url=${BUSINESS_SERVICE_URL:http://localhost:8082}

# AI Configuration (Server-Side Key Storage - Secret Environment Variable)
anthropic.api.key=${ANTHROPIC_API_KEY:}
