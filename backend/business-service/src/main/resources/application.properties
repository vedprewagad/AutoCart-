spring.application.name=business-service

server.port=${PORT:8082}

# Database (autocart_business)
spring.datasource.url=${BUSINESS_DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/autocart_business?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client Configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# JWT Configuration
jwt.secret=${JWT_SECRET:}

# AI Configuration (Server-Side Key Storage)
anthropic.api.key=${ANTHROPIC_API_KEY:}

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Internal Service-to-Service Security
internal.api.key=${INTERNAL_API_KEY:autocart-internal-secure-key-2026}